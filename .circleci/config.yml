version: 2.1

jobs:
  build_pokemonsearch:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd PokemonSearch && yarn install
      - run:
          name: Build project
          command: cd PokemonSearch && yarn build
      - run:
          name: Run tests
          command: cd PokemonSearch && yarn test

  build_algorithms:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd Algorithms && npm install
      - run:
          name: Build project
          command: cd Algorithms && npx vite build
      - run:
          name: Run tests
          command: cd Algorithms && npm test

workflows:
  build_and_test:
    jobs:
      - build_pokemonsearch
      - build_algorithms
